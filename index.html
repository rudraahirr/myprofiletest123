<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Portfolio | Digital Experience</title>
    <style>
        :root {
            --bg-base: #08090c;
            --bg-surface: rgba(18, 22, 31, 0.65);
            --border-glow: rgba(69, 243, 255, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-cyan: #45f3ff;
            --accent-violet: #a855f7;
            --accent-rose: #f43f5e;
            --font-stack: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-stack);
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Lighting Background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(140px);
            z-index: 1;
            pointer-events: none;
            opacity: 0.4;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--accent-cyan); top: -10%; left: -10%; }
        .orb-2 { width: 500px; height: 500px; background: var(--accent-violet); bottom: -10%; right: -10%; }

        /* Shared Glassmorphism Style */
        .glass {
            background: var(--bg-surface);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
        }

        /* Layout Container */
        .app-container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 24px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header Navigation */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, var(--accent-cyan), var(--accent-violet));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        .nav-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }
        .nav-btn.active {
            border-bottom: 2px solid var(--accent-cyan);
            border-radius: 8px 8px 0 0;
        }

        /* Dynamic Main Content Window */
        main {
            flex: 1;
            padding: 40px;
            min-height: 500px;
        }

        .page-view {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .page-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- HOME PAGE STYLES --- */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            max-width: 650px;
            padding-top: 40px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .cta-group {
            display: flex;
            gap: 16px;
            margin-top: 10px;
        }

        .btn {
            padding: 12px 28px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }

        .btn-primary {
            background: var(--accent-cyan);
            color: var(--bg-base);
            border: none;
            box-shadow: 0 4px 20px rgba(69, 243, 255, 0.25);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(69, 243, 255, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- WORKS/PORTFOLIO PAGE STYLES --- */
        .filter-bar {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }

        .filter-chip {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .filter-chip:hover, .filter-chip.active {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            border-color: var(--accent-cyan);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.02);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: rgba(69, 243, 255, 0.2);
        }

        .card-img {
            height: 160px;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(0,0,0,0.3));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
        }

        .card-body {
            padding: 20px;
        }

        .card-body h3 {
            font-size: 1.15rem;
            margin-bottom: 8px;
        }

        .card-body p {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        /* --- CONTACT PAGE FORM STYLES --- */
        .form-layout {
            max-width: 500px;
        }

        .form-layout h2 {
            margin-bottom: 10px;
        }

        .form-layout p {
            color: var(--text-muted);
            margin-bottom: 24px;
            font-size: 0.95rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 6px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-control {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-main);
            font-family: var(--font-stack);
            font-size: 0.95rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-cyan);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 120px;
        }

        .form-alert {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }
        .form-alert.success {
            display: block;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgb(16, 185, 129);
            color: #34d399;
        }

        /* Footer System */
        footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* Responsive Design Rules */
        @media (max-width: 768px) {
            header, footer {
                flex-direction: column;
                gap: 16px;
                text-align: center;
            }
            main { padding: 24px; }
            .hero h1 { font-size: 2.5rem; }
            .filter-bar { overflow-x: auto; width: 100%; padding-bottom: 8px; }
        }
    </style>
</head>
<body>

    <!-- Ambient Visual Glow Orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="app-container">
        
        <!-- Application Navigation Bar -->
        <header class="glass">
            <div class="logo">NEXUS.STUDIO</div>
            <nav id="main-nav">
                <button class="nav-btn active" data-target="home">Home</button>
